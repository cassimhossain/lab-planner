<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Robotics &amp; AI Club</title>
<!-- GitHub Pages serves this page for any address that doesn't exist, at any
     depth, so links are written from the site's root rather than from here.
     On cassimhossain.github.io the root is the first folder (/lab-planner/). -->
<script>
  (function () {
    var seg = location.pathname.split("/")[1];
    var base = /github\.io$/.test(location.hostname) && seg ? "/" + seg + "/" : "/";
    document.write('<base href="' + base + '">');
  })();
</script>
<script src="theme.js?v=39"></script>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="tokens.css?v=39">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-body); }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background-color: var(--trace-ink); -webkit-mask: var(--traces) 0 0 / 480px 480px repeat; mask: var(--traces) 0 0 / 480px 480px repeat; }
  main { position: relative; max-width: 520px; text-align: center; background: var(--surface); border-radius: var(--r-xl); box-shadow: var(--sh-2); padding: 36px 28px; }
  img { width: 96px; height: 96px; }
  .code { font: 700 13px var(--font-mono); letter-spacing: .12em; color: var(--accent-ink); }
  h1 { font: 800 var(--fs-3xl)/1.2 var(--font-display); margin: 6px 0 8px; letter-spacing: -.02em; }
  p { color: var(--ink-muted); margin: 0 0 22px; }
  nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  a { display: inline-flex; align-items: center; min-height: var(--tap); padding: 0 18px; border-radius: var(--r-md); border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; text-decoration: none; }
  a:hover { border-color: var(--line-strong); background: var(--surface-hover); }
  a.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
</style>
</head>
<body>
<main>
  <img src="logo.svg" alt="">
  <div class="code">ERROR 404</div>
  <h1>This page isn't here</h1>
  <p>It may have moved, or the link has a typo. Try one of these instead.</p>
  <nav>
    <a class="primary" href="./">Club home</a>
    <a href="./#curriculum">Lessons</a>
    <a href="circuit/">Circuit Lab</a>
    <a href="codelab/">Code Lab</a>
  </nav>
</main>
</body>
</html>
