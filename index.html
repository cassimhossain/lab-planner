<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robotics Lab Planner</title>
<meta name="description" content="Robotics & AI Club planner: plan each age group's sessions and print day-wise hardware kit lists.">

<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#home">
      <span class="logo"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="12" y="20" width="40" height="30" rx="9" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="25" cy="35" r="4" fill="#F5B83D"/><circle cx="39" cy="35" r="4" fill="#F5B83D"/><path d="M32 20v-9" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><circle cx="32" cy="9" r="4" fill="#F5B83D"/></svg></span>
      <span><b>Lab Planner</b><small>Robotics &amp; AI Club</small></span>

    <div class="weekbox">
      <button class="wkbtn" id="wkPrev" aria-label="Previous week">‹</button>

      <button class="wkbtn" id="wkNext" aria-label="Next week">›</button>
    </div>
    <nav class="menu" id="menu"></nav>

      <svg viewBox="0 0 160 40" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 28h28l6-12 8 24 6-12h18"/><circle cx="76" cy="28" r="5"/><path d="M81 28h18V10h26"/><circle cx="130" cy="10" r="5"/><rect x="92" y="22" width="14" height="12" rx="2"/></g></svg>

  <div class="main">
    <header class="mobilebar">
      <button class="burger" id="burger" aria-label="Menu">☰</button>
      <b>Lab Planner</b>
      <span id="mbWeek"></span>
    </header>
    <main id="app"></main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="viewer" id="viewer" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>

<script src="data.js"></script>
<script src="library.js"></script>

</html>
