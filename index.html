<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robotics Lab Planner</title>
<meta name="description" content="Robotics & AI Club planner: plan each age group's sessions and print day-wise hardware kit lists.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23183153'/%3E%3Crect x='16' y='22' width='32' height='24' rx='6' fill='none' stroke='%23fff' stroke-width='3.5'/%3E%3Ccircle cx='27' cy='34' r='3' fill='%23F4B740'/%3E%3Ccircle cx='37' cy='34' r='3' fill='%23F4B740'/%3E%3Cpath d='M32 22v-8' stroke='%23fff' stroke-width='3.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="appbar">
  <div class="wrap appbar-in">
    <a class="brand" href="#dashboard">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="currentColor"/><rect x="16" y="22" width="32" height="24" rx="6" fill="none" stroke="#fff" stroke-width="3.5"/><circle cx="27" cy="34" r="3" fill="#F4B740"/><circle cx="37" cy="34" r="3" fill="#F4B740"/><path d="M32 22v-8" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><circle cx="32" cy="12" r="3" fill="#F4B740"/></svg></span>
      <span><b>Lab Planner</b><small>Robotics &amp; AI Club · Pak-Turk Maarif</small></span>
    </a>
    <div class="weekpick">
      <button class="iconbtn" id="wkPrev" title="Previous week" aria-label="Previous week">‹</button>
      <div class="wk"><small>Planning week of</small><b id="wkLabel"></b></div>
      <button class="iconbtn" id="wkNext" title="Next week" aria-label="Next week">›</button>
      <input type="date" id="weekStart" aria-label="Pick week">
    </div>
  </div>
  <nav class="navbar">
    <div class="wrap nav-in" id="nav"></div>
  </nav>
</header>

<main class="wrap" id="app"></main>

<footer class="foot wrap noprint">
  <svg class="doodle" viewBox="0 0 140 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 12h24l4-7 6 14 4-7h20"/><circle cx="70" cy="12" r="4.5"/><path d="M75 12h20l4-7 6 14 4-7h29"/></g></svg>
  <span>Curriculum and planner by Qasim Mushtaq, MS Robotics and AI</span>
</footer>
<div id="toast" role="status"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
