<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Lab · Robotics &amp; AI Club</title>
<meta name="description" content="Write and run Python, C++, Python turtle graphics, p5.js, Processing and web pages in the browser, with error help and ready-made examples.">
<link rel="icon" type="image/svg+xml" href="../logo.svg">
<!-- lets Python's input() wait for typing: adds the cross-origin isolation headers GitHub Pages can't set -->
<script src="coi-serviceworker.js"></script>
<script src="../theme.js?v=4"></script>
<link rel="stylesheet" href="../tokens.css?v=4">
<link rel="stylesheet" href="vendor/codemirror.css?v=4">
<link rel="stylesheet" href="codelab.css?v=4">
</head>
<body>
<header class="top">
  <a class="brand" href="../index.html#sims" title="Back to the portal"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><img src="../logo.svg" alt=""><span><b>Code Lab</b><small>Robotics &amp; AI Club</small></span></a>
  <div class="langs" role="tablist" aria-label="Language">
    <button role="tab" id="tab-python" aria-controls="editor" aria-selected="true" data-lang="python" class="on"><span class="lg py">Py</span>Python</button>
    <button role="tab" id="tab-cpp" aria-controls="editor" aria-selected="false" data-lang="cpp"><span class="lg cpp">C++</span>C++</button>
    <button role="tab" id="tab-turtle" aria-controls="editor" aria-selected="false" data-lang="turtle"><span class="lg tu">Tu</span>Turtle</button>
    <button role="tab" id="tab-p5" aria-controls="editor" aria-selected="false" data-lang="p5"><span class="lg p5">p5</span>p5.js</button>
    <button role="tab" id="tab-processing" aria-controls="editor" aria-selected="false" data-lang="processing"><span class="lg pr">Pr</span>Processing</button>
    <button role="tab" id="tab-web" aria-controls="editor" aria-selected="false" data-lang="web"><span class="lg web">&lt;&gt;</span>Web</button>
  </div>
  <nav class="tb">
    <button class="tbtn" data-act="examples" title="Ready-made programs"><svg class="ic" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5M8 7h7M8 11h5"/></svg><span>Examples</span></button>
    <button class="tbtn" data-act="new" title="Start a new program"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New</span></button>
    <button class="tbtn icon" data-act="download" title="Download the program"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
    <button class="tbtn icon" data-act="upload" title="Open a .py or .cpp file"><svg class="ic" viewBox="0 0 24 24"><path d="M12 20V9M7 14l5-5 5 5M5 4h14"/></svg></button>
  </nav>
  <div class="grow"></div>
  <span id="engine" class="engine"></span>
  <button class="theme-btn" type="button" aria-label="Theme"><svg viewBox="0 0 24 24" aria-hidden="true"><g class="t-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></g><g class="t-moon"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></g><g class="t-auto"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></g></svg></button>
  <button id="runbtn" class="run" data-act="run" title="Run (Ctrl+Enter)"><svg class="ic" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg><span>Run</span></button>
</header>

<main class="main">
  <section class="edpane">
    <!-- the Web tab is three files in one program, so it gets a file strip;
         every other language keeps the single editable file name -->
    <div class="webfiles" id="webfiles" role="tablist" aria-label="Files" hidden>
      <button role="tab" data-file="html" class="on" aria-selected="true">index.html</button>
      <button role="tab" data-file="css" aria-selected="false">style.css</button>
      <button role="tab" data-file="js" aria-selected="false">script.js</button>
    </div>
    <div class="edbar">
      <input id="fname" class="fname" aria-label="File name" value="main.py">
      <div class="grow"></div>
      <button class="cbtn icon" data-act="smaller" title="Smaller text">A-</button>
      <button class="cbtn icon" data-act="bigger" title="Bigger text">A+</button>
      <button class="cbtn" data-act="format" title="Tidy up indentation">Tidy</button>
      <button class="cbtn" data-act="copy" title="Copy the code"><svg class="ic" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>Copy</button>
    </div>
    <div id="editor" class="editor"></div>
  </section>
  <div id="gutter" class="gutter" title="Drag to resize"></div>
  <section class="iopane">
    <div class="iobar">
      <b>Output</b><span id="runstate" class="runstate"></span>
      <div class="grow"></div>
      <button class="cbtn" id="autorun" data-act="autorun" title="Re-run as you type (Web, p5 and Processing)" aria-pressed="false" hidden>Live</button>
      <button class="cbtn icon" id="popout" data-act="popout" title="Open the result in its own tab" hidden><svg class="ic" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
      <button class="cbtn" data-act="clear" title="Clear the output">Clear</button>
    </div>
    <!-- Turtle draws into this; p5, Processing and Web run inside the frame.
         Both sit above the output log, which still carries print() and
         console.log() from whichever one is running. -->
    <div id="stage" class="stage" hidden>
      <div id="turtlewrap" class="turtlewrap" hidden><div id="turtlecanvas"></div></div>
      <!-- allow-same-origin is needed, not optional: Code Lab sets COEP so that
         Python's input() can block, and a sandboxed frame with an opaque
         origin is then refused p5.min.js and processing.min.js by the
         browser. Same-origin also means the student's code could reach this
         page, which is the same trust the Python and Web tabs already give
         it: their own code, in their own browser. -->
    <iframe id="frame" class="frame" title="Program output"
              sandbox="allow-scripts allow-same-origin allow-modals allow-popups allow-forms" hidden></iframe>
    </div>
    <div id="term" class="term" tabindex="0" aria-live="polite"></div>
    <div class="stdin">
      <div class="stdinh"><b>Input</b><small id="stdinhelp">Optional. Lines typed here are read first by input(). Leave it empty to type answers while the program runs.</small></div>
      <textarea id="stdin" spellcheck="false" placeholder="One value per line"></textarea>
    </div>
  </section>
</main>

<div id="modal" class="modal"><div class="mbox" id="mbox"></div></div>
<div id="toast" class="toast"></div>
<input id="fileup" type="file" accept=".py,.cpp,.cc,.c,.h,.txt,.js,.pde,.html,.htm,.css" hidden>

<script src="vendor/codemirror.min.js?v=4"></script>
<!-- javascript, css, xml and htmlmixed modes for the p5, Processing and Web tabs -->
<script src="vendor/cm-modes.js?v=4"></script>
<script type="module" src="app.js?v=4"></script>
</body>
</html>
